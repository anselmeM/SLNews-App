name: slnews_mobile
description: "SLNews - Sierra Leone news aggregation app (Flutter, iOS + Android)."
publish_to: 'none' # Private application; never published to pub.dev.

# versionName / versionCode for Android, CFBundleShortVersionString / CFBundleVersion for iOS.
version: 1.0.0+79

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0


  # State management (MVVM view models) + dependency injection.
  flutter_riverpod: ^3.5.0

  # Declarative routing (/for_you, /news, /sports, /following, /article/:id).
  go_router: ^18.1.4

  # Data layer: REST / GraphQL / JSON ingestion.
  dio: ^5.11.1

  # Offline-first local storage (articles, bookmarks, preferences).
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Images with disk cache + graceful placeholders.
  cached_network_image: ^4.0.7

  # Feed parsing at the boundary: RSS/Atom via xml, article bodies via html.
  #
  # `xml` is pinned below 7.0.1 because clerk_flutter -> flutter_svg ->
  # vector_graphics_compiler caps it there. The RSS/Atom parser only uses the
  # stable document/element API, and test/data/rss_parser_test.dart guards the
  # behaviour after any change here.
  xml: ^7.0.1
  html: ^0.15.7

  # Identity: Clerk's community-maintained (beta) Flutter SDK. Quarantined behind
  # AuthRepository/SignInSurface in lib/core/{domain/auth,providers}; no feature
  # imports this package. See docs/INTEGRATIONS.md before upgrading.
  clerk_flutter: ^0.0.18-beta

  # Article actions.
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  # Needed directly to relax Android's media-gesture requirement, without which
  # the reel's YouTube embed never autoplays.
  webview_flutter_android: ^4.14.1
  share_plus: ^13.3.1
  # 10.6.0 currently fails Android release compilation (missing replay recorder
  # class); keep the last known-good SDK until upstream fixes the plugin.
  sentry_flutter: 10.4.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.2
  flutter_tts: ^4.2.5
  home_widget: ^0.10.0
  youtube_player_iframe: ^6.0.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/seed/

  fonts:
    - family: SLNewsSans
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
