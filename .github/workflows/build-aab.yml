name: Build AAB

# Produces the Play Store artefact. Play rejects APK uploads for new apps, so this
# is the workflow a release is cut from; build-apk.yml stays for device installs.
on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

jobs:
  bundle:
    name: Analyze, test and package the release app bundle
    # Dependabot PR workflows do not receive repository secrets, so the signed
    # bundle step cannot pass there. Dependency PRs are validated by the
    # secret-free Dependency check and the APK build; the AAB gate still runs on
    # every push to master (including the auto-merge commit).
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be read from a step-level `if:`; route through env like the
      # APK workflow does.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Secret scan
        shell: pwsh
        run: ./scripts/check-secrets.ps1

      - name: Test with coverage (serial; parallel workers deadlock on this suite)
        run: flutter test test/core test/data test/features test/sync --coverage --concurrency=1

      - name: Enforce app coverage ratchet
        run: python3 scripts/check_app_coverage.py

      # Real config from the repository secret; PR builds use the non-secret
      # placeholder because pull-request workflows do not receive secrets.
      - name: Restore Firebase client config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            cp android/app/google-services.json.example android/app/google-services.json
            echo "::warning::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is not set; PR build uses the placeholder Firebase config."
          else
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is not set; refusing to build a release without Firebase config."
            exit 1
          fi

      # Goldens are a local visual-review harness: the PNGs are host-renderer
      # dependent (Flutter's Linux rasterizer differs from Windows), so they are
      # intentionally not a CI gate.

      - name: Restore upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/slnews-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../slnews-release.jks\n' \
            "$ANDROID_STORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" \
            "$ANDROID_KEY_ALIAS" > android/key.properties

      - name: Fail without a signing key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "ANDROID_KEYSTORE_BASE64 is not set: the bundle would be debug-signed and Play would reject it." >&2
          exit 1

      - name: Build app bundle
        run: |
          DEFINES=""
          if [ -n "$SENTRY_DSN" ]; then
            DEFINES="--dart-define=SENTRY_DSN=$SENTRY_DSN --dart-define=SENTRY_ENV=production"
          else
            echo "::warning::SENTRY_DSN is not set; building without crash reporting"
          fi
          flutter build appbundle --release $DEFINES

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: slnews-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
