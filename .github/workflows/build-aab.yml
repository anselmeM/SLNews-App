name: Build AAB

# Produces the Play Store artefact. Play rejects APK uploads for new apps, so this
# is the workflow a release is cut from; build-apk.yml stays for device installs.
#
# Deliberately NOT triggered by pull requests: the APK workflow already runs the
# full test/analyze/coverage gate on every PR, so building and testing the bundle
# again there doubled CI minutes for the same commit. The bundle is now built
# only on master/tags, and it skips the test suite because the APK gate that ran
# on the same commit (or the PR that produced it) already did that work.
on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  # A newer push to the same ref cancels the older bundle build.
  group: build-aab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: Build release app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Secrets cannot be read from a step-level `if:`; route through env like the
      # APK workflow does.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # Publishable by design, but still routed through a secret so the value
      # lives in one place. Without it the app is anonymous: sign-in, account
      # sync and push registration (which needs a session token) are all off.
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      # The scraper key that makes /v1/videos (and API-backed news) available to
      # signed-out readers. Empty means the rail falls back to the bundled clips.
      SLNEWS_API_KEY: ${{ secrets.SLNEWS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          # Gradle dependency cache (~/.gradle/caches + wrapper), keyed on the
          # Android build files. The build itself dominates the job (~12 min
          # warm otherwise), so this is the step worth caching.
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Real config from the repository secret. Master/tag builds require it;
      # a workflow_dispatch run without secrets fails loudly rather than shipping
      # an anonymous bundle.
      - name: Restore Firebase client config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is not set; refusing to build a release without Firebase config."
            exit 1
          fi

      - name: Restore upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/slnews-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../slnews-release.jks\n' \
            "$ANDROID_STORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" \
            "$ANDROID_KEY_ALIAS" > android/key.properties

      - name: Fail without a signing key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "ANDROID_KEYSTORE_BASE64 is not set: the bundle would be debug-signed and Play would reject it." >&2
          exit 1

      - name: Build app bundle
        run: |
          DEFINES=""
          if [ -n "$SENTRY_DSN" ]; then
            DEFINES="--dart-define=SENTRY_DSN=$SENTRY_DSN --dart-define=SENTRY_ENV=production"
          else
            echo "::warning::SENTRY_DSN is not set; building without crash reporting"
          fi
          if [ -n "$CLERK_PUBLISHABLE_KEY" ]; then
            DEFINES="$DEFINES --dart-define=CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY"
          else
            echo "::warning::CLERK_PUBLISHABLE_KEY is not set; the app runs anonymously, so sign-in, account sync and push registration stay off"
          fi
          if [ -n "$SLNEWS_API_KEY" ]; then
            DEFINES="$DEFINES --dart-define=SLNEWS_API_KEY=$SLNEWS_API_KEY"
          else
            echo "::warning::SLNEWS_API_KEY is not set; /v1/videos is unavailable to signed-out readers and the rail uses the bundled clips"
          fi
          flutter build appbundle --release $DEFINES

      - name: Upload AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slnews-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
