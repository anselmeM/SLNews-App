name: Build APK

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and package the release APK
    runs-on: ubuntu-latest
    # Secrets cannot be referenced from a step-level `if:` — GitHub rejects the
    # whole workflow ("Unrecognized named-value: 'secrets'"), which is why the
    # keystore is routed through env and the step tests env instead.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # Publishable by design. Without it the app is anonymous, which also turns
      # off push registration: the devices endpoint needs a session token.
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The new-file coverage gate diffs against the PR base commit.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle dependency cache (~/.gradle/caches + wrapper), keyed on the
          # Android build files. The build itself dominates the job (~12 min
          # warm otherwise), so this is the step worth caching.
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      # test/golden is excluded on purpose: its pixels depend on the host
      # renderer, so it is a local visual-review harness rather than a gate.
      - name: Secret scan
        shell: pwsh
        run: ./scripts/check-secrets.ps1

      - name: Test with coverage (4 workers, 5.8 min vs 11 serial)
        run: flutter test test/core test/data test/features test/sync test/push test/security --coverage --concurrency=4

      - name: Enforce app quality gates
        run: python3 scripts/check_app_coverage.py

      - name: Enforce new-file coverage
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_new_file_coverage.py --base "${{ github.event.pull_request.base.sha }}"

      # The real Firebase client config is a repository secret. PRs from
      # Dependabot/forks do not receive secrets, so they compile against the
      # non-secret placeholder; master pushes require the real config.
      - name: Restore Firebase client config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            cp android/app/google-services.json.example android/app/google-services.json
            echo "::warning::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is not set; PR build uses the placeholder Firebase config."
          else
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is not set; refusing to build a release without Firebase config."
            exit 1
          fi

      # Goldens are a local visual-review harness: the PNGs are host-renderer
      # dependent (Flutter's Linux rasterizer differs from Windows), so they are
      # intentionally not a CI gate.

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/slnews-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../slnews-release.jks\n' \
            "${{ secrets.ANDROID_STORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" > android/key.properties

      - name: Build release APK
        run: |
          DEFINES=""
          if [ -n "$SENTRY_DSN" ]; then
            DEFINES="--dart-define=SENTRY_DSN=$SENTRY_DSN --dart-define=SENTRY_ENV=production"
          fi
          if [ -n "$CLERK_PUBLISHABLE_KEY" ]; then
            DEFINES="$DEFINES --dart-define=CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY"
          else
            echo "::warning::CLERK_PUBLISHABLE_KEY is not set; the app runs anonymously"
          fi
          flutter build apk --release --split-per-abi $DEFINES

      - name: Checksums
        run: sha256sum build/app/outputs/flutter-apk/*.apk

      - name: Upload APK artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slnews-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
