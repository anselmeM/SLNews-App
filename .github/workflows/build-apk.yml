name: Build APK

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and package the release APK
    runs-on: ubuntu-latest
    # Secrets cannot be referenced from a step-level `if:` — GitHub rejects the
    # whole workflow ("Unrecognized named-value: 'secrets'"), which is why the
    # keystore is routed through env and the step tests env instead.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      # test/golden is excluded on purpose: its pixels depend on the host
      # renderer, so it is a local visual-review harness rather than a gate.
      - name: Secret scan
        shell: pwsh
        run: ./scripts/check-secrets.ps1

      - name: Test with coverage (serial; parallel workers deadlock on this suite)
        run: flutter test test/core test/data test/features test/sync --coverage --concurrency=1

      - name: Enforce app coverage ratchet
        run: python3 scripts/check_app_coverage.py

      - name: Golden tests
        run: flutter test test/golden test/features/feed/daily_briefing_golden_test.dart --concurrency=1

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/slnews-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../slnews-release.jks\n' \
            "${{ secrets.ANDROID_STORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" > android/key.properties

      - name: Build release APK
        run: |
          DEFINES=""
          if [ -n "$SENTRY_DSN" ]; then
            DEFINES="--dart-define=SENTRY_DSN=$SENTRY_DSN --dart-define=SENTRY_ENV=production"
          fi
          flutter build apk --release --split-per-abi $DEFINES

      - name: Checksums
        run: sha256sum build/app/outputs/flutter-apk/*.apk

      - name: Upload APK artefacts
        uses: actions/upload-artifact@v4
        with:
          name: slnews-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
