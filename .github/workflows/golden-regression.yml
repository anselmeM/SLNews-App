name: Visual regression

# Goldens are renderer-dependent, so they are not part of the main Linux gate.
# The repository's baseline PNGs are generated on Windows; this job keeps the
# same host and runs only when UI/assets/goldens change. It is a real gate for
# the files it touches, not a substitute for a device screenshot review.
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'test/golden/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/golden-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  goldens:
    name: Render golden screens
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The checked-in baseline was rendered with the US Eastern zone. Pin it
      # explicitly: Windows runners default to UTC, which changes the article
      # publication line ("EST" vs "UTC") and makes one golden fail for reasons
      # unrelated to UI changes.
      - name: Pin runner time zone to the golden baseline
        shell: pwsh
        run: |
          tzutil /s "Eastern Standard Time"
          Get-TimeZone

      - name: Render and compare goldens
        run: flutter test test/golden --concurrency=1

      - name: Upload failed renders
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: test/golden/failures/**
          if-no-files-found: ignore
          retention-days: 14
