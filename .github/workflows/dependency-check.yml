name: Dependency check

# Fast, secret-free validation for dependency-only PRs. This is the check the
# Dependabot auto-merge gate waits for; it never needs the Android signing key,
# which Dependabot PR workflows do not receive.
on:
  pull_request:
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pub dependency update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test test/core test/data test/features test/sync test/push --coverage --concurrency=4

      - name: Enforce app quality gates
        run: python3 scripts/check_app_coverage.py
