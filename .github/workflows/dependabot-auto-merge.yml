name: Dependabot auto-merge

# Runs from the base branch with a write token (pull_request_target). It never
# checks out or executes PR code: it reads Dependabot's metadata, waits for the
# secret-free dependency check and the APK job, then squash-merges patch/minor
# pub updates. Major, Gradle and GitHub Actions updates stay manual.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  auto-merge:
    name: Auto-merge patch and minor pub updates
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for validation, then merge
        if: >
          steps.metadata.outputs.package-ecosystem == 'pub' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          check_state() {
            local name="$1"
            local runs="$2"
            printf '%s' "$runs" | jq -r --arg name "$name" '
              [.check_runs[] | select(.name == $name)][0]
              | if . == null then "missing"
                else "\(.status) \(.conclusion // "pending")"
                end
            '
          }

          for attempt in $(seq 1 80); do
            runs="$(gh api "repos/$REPO/commits/$PR_SHA/check-runs?per_page=100")"
            dep="$(check_state "Verify pub dependency update" "$runs")"
            apk="$(check_state "Analyze, test and package the release APK" "$runs")"

            echo "attempt $attempt: dependency=$dep apk=$apk"

            case "$dep" in
              "completed failure"|"completed cancelled"|"completed timed_out"|"completed action_required"|"completed skipped")
                echo "Dependency check did not pass: $dep" >&2
                exit 1
                ;;
            esac
            case "$apk" in
              "completed failure"|"completed cancelled"|"completed timed_out"|"completed action_required"|"completed skipped")
                echo "APK validation did not pass: $apk" >&2
                exit 1
                ;;
            esac

            if [ "$dep" = "completed success" ] && [ "$apk" = "completed success" ]; then
              gh pr merge --squash --delete-branch "$PR_URL"
              exit 0
            fi

            sleep 30
          done

          echo "Timed out waiting for dependency/APK validation" >&2
          exit 1
